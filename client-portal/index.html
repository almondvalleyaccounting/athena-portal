<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Almond Valley Accounting — Client Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f6f8f9; font-family: 'Outfit', -apple-system, 'Segoe UI', Arial, sans-serif; color: #1e293b; }
      input, textarea, button, select { font-family: inherit; }

      /* ── Motion system ─────────────────────────────────────── */
      @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
      @keyframes blobFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -24px) scale(1.08); }
        66% { transform: translate(-20px, 18px) scale(0.95); }
      }
      @keyframes gradientPan { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(240%); } }
      @keyframes waveHand { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(16deg); } 40% { transform: rotate(-8deg); } 60% { transform: rotate(12deg); } 80% { transform: rotate(-4deg); } }
      @keyframes introFade { to { opacity: 0; visibility: hidden; } }

      .fade-up { animation: fadeUp 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
      .pop-in { animation: popIn 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
      .wave { display: inline-block; animation: waveHand 1.6s ease 0.6s 1; transform-origin: 70% 70%; }

      .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.5; animation: blobFloat 14s ease-in-out infinite; pointer-events: none; }

      .progress-ring circle.fg { transition: stroke-dashoffset 1.2s cubic-bezier(0.2, 0.7, 0.3, 1); }
      .bar-shimmer { position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent); animation: shimmer 2.4s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
